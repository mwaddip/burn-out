name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mirror-check:
    name: Soong mirror divergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Soong mirror is in sync with Gradle source
        run: bash scripts/check-mirror.sh

  unit-tests:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'app/build.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
